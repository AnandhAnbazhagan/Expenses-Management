<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Expense - Expense Management</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="sidebar-logo">
            Expense Management
        </div>

        <a href="employee-dashboard.html">
            Dashboard
        </a>

        <a href="employee-expenses.html">
            My Expenses
        </a>

        <a
            href="add-expense.html"
            class="active"
        >
            Add Expense
        </a>

        <a href="employee-claims.html">
            Reimbursements
        </a>

        <a
            href="#"
            onclick="logout(); return false;"
        >
            Logout
        </a>

    </aside>


    <main class="main-content">

        <div class="topbar">

            <div>

                <h1>
                    Add Expense
                </h1>

                <p>
                    Manually submit a new expense
                </p>

            </div>


            <div class="user-info">

                <div
                    class="user-avatar"
                    id="userAvatar"
                >
                    E
                </div>

                <span id="userName">
                    Employee
                </span>

                <button
                    class="logout-btn"
                    onclick="logout()"
                >
                    Logout
                </button>

            </div>

        </div>


        <div class="form-card">

            <h2>
                Expense Details
            </h2>

            <p class="form-description">
                Enter your expense information below.
            </p>


            <form id="expenseForm">

                <div class="form-group">

                    <label for="project">
                        Project *
                    </label>

                    <input
                        type="text"
                        id="project"
                        placeholder="Enter project name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="date">
                        Expense Date *
                    </label>

                    <input
                        type="date"
                        id="date"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="category">
                        Category *
                    </label>

                    <select
                        id="category"
                        required
                    >

                        <option value="">
                            Select Category
                        </option>

                        <option value="Travel">
                            Travel
                        </option>

                        <option value="Food">
                            Food
                        </option>

                        <option value="Accommodation">
                            Accommodation
                        </option>

                        <option value="Office Supplies">
                            Office Supplies
                        </option>

                        <option value="Equipment">
                            Equipment
                        </option>

                        <option value="Transportation">
                            Transportation
                        </option>

                        <option value="Communication">
                            Communication
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="description">
                        Description *
                    </label>

                    <textarea
                        id="description"
                        rows="4"
                        placeholder="Describe the expense"
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="amount">
                        Amount (₹) *
                    </label>

                    <input
                        type="number"
                        id="amount"
                        placeholder="Enter amount"
                        min="1"
                        step="0.01"
                        required
                    >

                </div>


                <div
                    id="expenseMessage"
                    class="form-message"
                ></div>


                <div class="expense-actions">

                 <button type="submit" class="submit-expense-btn">
                  Submit Expense
                 </button>

                <a href="employee-dashboard.html" class="cancel-expense-btn">
                 Cancel
                  </a>

</div>

            </form>

        </div>

    </main>

</div>


<script src="script.js"></script>

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        if (!checkEmployeeAccess()) {
            return;
        }

        displayCurrentUser();

        setTodayDate();

        document
            .getElementById("expenseForm")
            .addEventListener(
                "submit",
                submitExpense
            );

    }
);

</script>

</body>
</html>
